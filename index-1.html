const firebaseConfig={apiKey:"AIzaSyDForvSsN1cMgEtHNFUIXTUmua3XTl6Lys",authDomain:"laundry-7.firebaseapp.com",projectId:"laundry-7",storageBucket:"laundry-7.firebasestorage.app",messagingSenderId:"765868065792",appId:"1:765868065792:web:1c30e2b1b9d67afaeff84e5"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),google=new GoogleAuthProvider();
const A=id=>document.getElementById(id),authView=A("authView"),appView=A("appView"),daysEl=A("days"),scheduleEl=A("schedule"),modalRoot=A("modalRoot"),toastEl=A("toast"),nav=A("nav");

const times=Array.from({length:17},(_,i)=>String(i+6).padStart(2,"0")+":00"),end=t=>String(+t.slice(0,2)+1).padStart(2,"0")+":00",mins=t=>(+t.slice(0,2)*60 + +t.slice(3,5)),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function moscow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,minutes:+p.hour*60 + +p.minute}}
function add(date,n){const d=new Date(date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function wd(d){return new Date(d+"T12:00:00Z").getUTCDay()}function weekend(d){return[0,6].includes(wd(d))}function canWeekend(){return["student_council","admin"].includes(profile?.role)}function dtext(d){return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(d+"T12:00:00Z"))}function wtext(d){return["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][wd(d)]}function expired(d,t){const n=moscow();return d<n.date||(d===n.date&&n.minutes>=mins(t)+30)}function active(b){const n=moscow();if(b.status==="cancelled")return false;return b.booking_date>n.date||(b.booking_date===n.date&&n.minutes<mins(b.start_time)+30)}function dates(){const t=moscow().date,w=wd(t),o=[];if(w>=1&&w<=3)o.push(0,1);else if(w===4)o.push(0,1,2,3);else if(w===5)o.push(0,1,2);else o.push(0,1);return o.map(x=>add(t,x))}function role(r){return r==="admin"?"Администратор":r==="student_council"?"Студсовет":"Жилец"}function idFor(d,t,m){return`${d}_${t.replace(":","")}_m${m}`}function toast(s){toastEl.textContent=s;toastEl.classList.add("show");clearTimeout(toastEl.t);toastEl.t=setTimeout(()=>toastEl.classList.remove("show"),2400)}function close(){modalRoot.innerHTML=""}function sheet(x){modalRoot.innerHTML=`<div class="overlay" id="ov"><div class="sheet"><div class="grab"></div>${x}</div></div>`;A("ov").onclick=e=>{if(e.target.id==="ov")close()}}

async function countMine(){const s=await getDocs(query(collection(db,"bookings"),where("uid","==",user.uid)));return s.docs.map(d=>d.data()).filter(active).length}
function openBook(t,m){sheet(`<h2>Машинка №${m}</h2><div class="meta">${dtext(selectedDate)} · ${t}–${end(t)}</div><div class="info"><div class="rowInfo">👤<div><b>${esc(profile.name)}</b><small>Имя</small></div></div><div class="rowInfo">🏠<div><b>Комната ${esc(profile.room)}</b><small>Комната</small></div></div><div class="rowInfo">📞<div><b>${esc(profile.phone)}</b><small>Телефон виден другим жильцам</small></div></div></div><div id="bookMsg" class="msg"></div><div class="actions"><button id="no" class="btn secondary">Отмена</button><button id="yes" class="btn primary">Забронировать</button></div>`);A("no").onclick=close;A("yes").onclick=async()=>{const b=A("yes"),msg=A("bookMsg");b.disabled=true;b.textContent="Проверяю…";msg.textContent="";try{if(expired(selectedDate,t))throw Error("expired");if(weekend(selectedDate)&&!canWeekend())throw Error("weekend");if(await countMine()>=10)throw Error("limit");const ref=doc(db,"bookings",idFor(selectedDate,t,m));await runTransaction(db,async tr=>{const s=await tr.get(ref);if(s.exists()&&s.data().status!=="cancelled")throw Error("taken");if(s.exists()&&s.data().status==="cancelled")throw Error("oldcancel");tr.set(ref,{booking_id:idFor(selectedDate,t,m),uid:user.uid,machine_number:m,machine_id:String(m),booking_date:selectedDate,start_time:t,time_code:t.replace(":",""),name:profile.name,room:profile.room,phone:profile.phone,status:"active",created_at:serverTimestamp()})});close();toast(`✓ №${m} забронирована на ${t}`)}catch(e){msg.textContent=e.message==="limit"?"У вас уже 10 активных слотов.":e.message==="taken"?"Этот слот уже заняли.":e.message==="weekend"?"Выходные доступны только студсовету.":e.message==="expired"?"Этот слот уже закрылся.":e.message==="oldcancel"?"Этот слот уже был отменён ранее. Пока выберите другой слот.":"Не удалось забронировать: "+e.message;b.disabled=false;b.textContent="Забронировать"}}}

async function cancelBooking(b){try{const batch=writeBatch(db),histRef=doc(collection(db,"booking_history"));batch.set(histRef,{history_id:histRef.id,booking_id:b.id,uid:b.uid,machine_number:b.machine_number,booking_date:b.booking_date,start_time:b.start_time,name:b.name||"",room:b.room||"",phone:b.phone||"",status:"cancelled",cancelled_at:serverTimestamp(),cancelled_by:user.uid});batch.delete(doc(db,"bookings",b.id));await batch.commit();close();toast("Запись отменена") }catch(e){toast("Не удалось отменить запись")}}
async function openMine(){navActive("mine");sheet('<h2>Мои записи</h2><div class="meta">Активные слоты из лимита 10</div><div id="mineList" class="cards"><div class="skeleton"></div></div><button id="mineClose" class="btn secondary" style="margin-top:13px">Закрыть</button>');A("mineClose").onclick=()=>{close();navActive("schedule")};const s=await getDocs(query(collection(db,"bookings"),where("uid","==",user.uid))),arr=s.docs.map(d=>({id:d.id,...d.data()})).filter(active).sort((a,b)=>(a.booking_date+a.start_time).localeCompare(b.booking_date+b.start_time)),root=A("mineList");root.innerHTML=arr.length?"":'<div class="empty">Активных записей нет.</div>';for(const b of arr){const c=document.createElement("div");c.className="mini";c.innerHTML=`<strong>${dtext(b.booking_date)} · ${b.start_time}–${end(b.start_time)}</strong><div class="s">Машинка №${b.machine_number} · ${esc(b.name)} · комната ${esc(b.room)}</div><button class="btn danger">Отменить</button>`;c.querySelector("button").onclick=()=>cancelBooking(b);root.appendChild(c)}}
function openProfile(first=false){if(!first)navActive("profile");sheet(`<h2>${first?"Заполните профиль":"Профиль"}</h2><div class="meta">${first?"Это нужно сделать один раз после регистрации.":"Данные используются при бронировании."}</div><div class="field"><label>Имя</label><input id="pName" value="${esc(profile?.name||"")}"></div><div class="field"><label>Комната</label><input id="pRoom" value="${esc(profile?.room||"")}"></div><div class="field"><label>Телефон</label><input id="pPhone" value="${esc(profile?.phone||"")}" placeholder="+7 999 123-45-67"></div><div class="hint">Имя, комната и телефон видны другим авторизованным жильцам в занятом слоте.</div><div id="pMsg" class="msg"></div><div class="actions">${first?"":'<button id="pClose" class="btn secondary">Закрыть</button>'}<button id="pSave" class="btn primary">Сохранить</button></div>${first?"":'<button id="logout" class="btn danger" style="margin-top:9px">Выйти из аккаунта</button>'}`);if(!first){A("pClose").onclick=()=>{close();navActive("schedule")};A("logout").onclick=()=>{close();signOut(auth)}}A("pSave").onclick=async()=>{const name=A("pName").value.trim(),room=A("pRoom").value.trim(),phone=A("pPhone").value.trim(),msg=A("pMsg");if(name.length<2||!room||phone.replace(/\D/g,"").length<6){msg.textContent="Проверьте имя, комнату и телефон.";return}try{const ref=doc(db,"users",user.uid),s=await getDoc(ref);if(!s.exists())await setDoc(ref,{name,room,phone,email:user.email||"",role:"resident",created_at:serverTimestamp(),updated_at:serverTimestamp()});else await updateDoc(ref,{name,room,phone,updated_at:serverTimestamp()});profile={...(profile||{}),name,room,phone,email:user.email||"",role:profile?.role||"resident"};close();identity();renderDays();subSchedule();toast("Профиль сохранён")}catch(e){msg.textContent="Не удалось сохранить: "+e.message}}}
async function openAdmin(){if(profile?.role!=="admin")return;navActive("admin");sheet('<h2>Управление</h2><div class="meta">Пользователи, роли и история</div><button id="users" class="btn primary">Пользователи и роли</button><button id="hist" class="btn secondary" style="margin-top:8px">История бронирований</button><button id="aclose" class="btn secondary" style="margin-top:8px">Закрыть</button>');A("users").onclick=openUsers;A("hist").onclick=openHistory;A("aclose").onclick=()=>{close();navActive("schedule")}}
async function openUsers(){sheet('<h2>Пользователи</h2><div class="meta">Студсовет получает только доступ к выходным.</div><div id="usersList" class="cards"><div class="skeleton"></div></div><button id="back" class="btn secondary" style="margin-top:13px">Назад</button>');A("back").onclick=openAdmin;const s=await getDocs(collection(db,"users")),arr=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru")),root=A("usersList");root.innerHTML="";for(const u of arr){const c=document.createElement("div");c.className="mini";c.innerHTML=`<strong>${esc(u.name||"Без имени")}</strong><div class="s">Комната ${esc(u.room||"—")} · ${esc(u.phone||"—")}<br>${esc(u.email||"")} · ${role(u.role)}</div>`;if(u.role!=="admin"){const b=document.createElement("button");b.className="btn "+(u.role==="student_council"?"secondary":"success");b.textContent=u.role==="student_council"?"Сделать жильцом":"Дать доступ студсовета";b.onclick=async()=>{await updateDoc(doc(db,"users",u.id),{role:u.role==="student_council"?"resident":"student_council",updated_at:serverTimestamp()});toast("Роль изменена");openUsers()};c.appendChild(b)}root.appendChild(c)}}
async function openHistory(){sheet('<h2>История</h2><div class="meta">Последние 100 записей и отмен</div><div id="histList" class="cards"><div class="skeleton"></div></div><button id="back" class="btn secondary" style="margin-top:13px">Назад</button>');A("back").onclick=openAdmin;const [cur,arc]=await Promise.all([getDocs(collection(db,"bookings")),getDocs(collection(db,"booking_history"))]);const arr=[...cur.docs.map(d=>({id:d.id,...d.data()})),...arc.docs.map(d=>({id:d.id,...d.data()}))].sort((a,b)=>(b.booking_date+b.start_time).localeCompare(a.booking_date+a.start_time)).slice(0,100),root=A("histList");root.innerHTML=arr.length?"":'<div class="empty">История пуста.</div>';for(const b of arr){const c=document.createElement("div");c.className="mini";c.innerHTML=`<strong>${dtext(b.booking_date)} · ${b.start_time}–${end(b.start_time)} · №${b.machine_number}</strong><div class="s">${esc(b.name||"—")} · комната ${esc(b.room||"—")} · ${esc(b.phone||"—")}<br>Статус: ${b.status==="cancelled"?"отменено":active(b)?"активно":"завершено"}</div>`;if(active(b)&&b.status!=="cancelled"){const x=document.createElement("button");x.className="btn danger";x.textContent="Отменить запись";x.onclick=()=>cancelBooking(b);c.appendChild(x)}root.appendChild(c)}}
function identity(){A("roleBadge").textContent=role(profile?.role);A("profileChip").textContent=profile?.name?.split(" ")[0]||"Профиль";const old=document.querySelector('[data-nav="admin"]');if(profile?.role==="admin"&&!old){nav.classList.add("admin");const b=document.createElement("button");b.className="navbtn";b.dataset.nav="admin";b.innerHTML="<span>⚙️</span>Управление";b.onclick=openAdmin;nav.appendChild(b)}else if(profile?.role!=="admin"&&old){old.remove();nav.classList.remove("admin")}}
function navActive(n){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.nav===n))}document.querySelector('[data-nav="schedule"]').onclick=()=>{navActive("schedule");close()};document.querySelector('[data-nav="mine"]').onclick=openMine;document.querySelector('[data-nav="profile"]').onclick=()=>openProfile(false);A("profileChip").onclick=()=>openProfile(false);
async function loadProfile(){const s=await getDoc(doc(db,"users",user.uid));if(!s.exists()){profile=null;openProfile(true);return}profile=s.data();identity();renderDays();subSchedule()}
onAuthStateChanged(auth,async u=>{user=u;if(!u){profile=null;if(unsub)unsub();appView.classList.add("hidden");authView.classList.remove("hidden");return}authView.classList.add("hidden");appView.classList.remove("hidden");await loadProfile()});
A("toggleAuth").onclick=()=>{mode=mode==="login"?"register":"login";A("emailBtn").textContent=mode==="login"?"Войти":"Зарегистрироваться";A("toggleAuth").textContent=mode==="login"?"Создать аккаунт":"У меня уже есть аккаунт";A("resetBtn").classList.toggle("hidden",mode==="register");A("authMsg").textContent=""};A("emailBtn").onclick=async()=>{const email=A("authEmail").value.trim(),p=A("authPassword").value,msg=A("authMsg");msg.textContent="";try{if(mode==="register")await createUserWithEmailAndPassword(auth,email,p);else await signInWithEmailAndPassword(auth,email,p)}catch(e){msg.textContent=authError(e.code)}};A("googleBtn").onclick=async()=>{A("authMsg").textContent="";try{await signInWithPopup(auth,google)}catch(e){A("authMsg").textContent=authError(e.code)}};A("resetBtn").onclick=async()=>{const email=A("authEmail").value.trim();if(!email){A("authMsg").textContent="Сначала введите email.";return}try{await sendPasswordResetEmail(auth,email);A("authMsg").textContent="Письмо для сброса пароля отправлено."}catch(e){A("authMsg").textContent=authError(e.code)}};function authError(c){return({"auth/invalid-email":"Неверный email.","auth/weak-password":"Пароль должен быть не короче 6 символов.","auth/email-already-in-use":"Аккаунт с таким email уже существует.","auth/invalid-credential":"Неверный email или пароль.","auth/popup-closed-by-user":"Окно Google было закрыто.","auth/unauthorized-domain":"Добавьте uandijan.github.io в Authorized domains Firebase."}[c]||"Ошибка входа: "+c)}setInterval(()=>{if(user&&profile){renderDays();renderSchedule()}},30000);
</script></body></html>
